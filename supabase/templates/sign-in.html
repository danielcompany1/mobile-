<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your DueDay sign-in code</title>
  </head>
  <body style="margin: 0; padding: 24px 16px; background-color: #f4f5f0; color: #17291e; font-family: Arial, Helvetica, sans-serif; line-height: 1.6;">
    <table role="presentation" style="width: 100%; max-width: 480px; margin: 0 auto; border-collapse: collapse; background-color: #ffffff;">
      <tr>
        <td style="padding: 32px 24px;">
          <p style="margin: 0 0 24px; color: #345b43; font-size: 18px; font-weight: 700;">DueDay</p>
          <h1 style="margin: 0 0 16px; font-size: 26px; line-height: 1.3;">Your sign-in code</h1>
          <p style="margin: 0 0 20px;">Enter this one-time code in the DueDay app or browser where you requested it:</p>
          <p style="margin: 0 0 24px; padding: 16px 8px; background-color: #eef3eb; color: #17291e; text-align: center; font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 700; letter-spacing: 6px; white-space: nowrap;">{{ .Token }}</p>
          <p style="margin: 0 0 16px;">Keep this code private. If it no longer works, request a new code from DueDay.</p>
          <p style="margin: 0; color: #526258; font-size: 14px;">If you did not request this email, you can ignore it.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
