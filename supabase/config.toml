project_id = "dueday"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["dueday://auth/callback", "http://localhost:3000/auth/callback"]

[auth.email]
enable_signup = true
enable_confirmations = true
otp_expiry = 600
otp_length = 8

# Local Auth templates. Hosted projects must set these in the Dashboard separately.
[auth.email.template.magic_link]
subject = "Your DueDay sign-in code"
content_path = "./supabase/templates/sign-in.html"

[auth.email.template.confirmation]
subject = "Your DueDay sign-in code"
content_path = "./supabase/templates/sign-in.html"
